name: CD workflow
on: 
  workflow_call:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v3

     -  name: Check API key secret
        env:
          API_KEY: ${{ secrets.REACT_APP_RECIPE_APP_API_KEY }}
        run: |
          echo "API key length: ${#API_KEY}"
          test -n "$API_KEY" 
     
      - name: Deploy with Docker Compose
        env:
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          PORT: ${{ secrets.PORT }}
        run: docker compose -f docker-compose.yml build --no-cache frontend && docker compose -f docker-compose.yml up -d
 
  